name: Platform checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  auditor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: auditor
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: PYTHONPATH=.. python -m pytest
      - name: Generate audit report from fixtures
        shell: bash
        run: |
          status=0
          python -m databricks_auditor.cli audit --out ../reports || status=$?
          test "$status" -eq 0 || test "$status" -eq 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-audit-report
          path: reports/
          if-no-files-found: error

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.10.5'
      - run: terraform fmt -check -recursive terraform
      - run: terraform -chdir=terraform/envs/dev init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=terraform/envs/dev validate -no-color
